<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Калькулятор дневной нормы калорий и БЖУ по формуле Миффлина — Сан-Жеора с прогнозом веса и меню на день.">
  <meta name="theme-color" content="#f1ebe2">
  <title>Калькулятор калорий — CaloTrack</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" href="fonts/onest-variable.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/nunito-black.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/meal-planner.css">
  <script src="js/theme-manager.js"></script>
</head>
<body>
  <main class="page" id="main">
    <h1 class="display page-title">Расчёт нормы</h1>

    <div class="calculator">
      <form id="calorie-form" class="calc-form">
        <fieldset class="field">
          <legend>Пол</legend>
          <div class="choice-pills">
            <label><input type="radio" name="gender" value="male" checked><span>Мужской</span></label>
            <label><input type="radio" name="gender" value="female"><span>Женский</span></label>
          </div>
        </fieldset>

        <div class="measurements">
          <label class="capsule-field">
            <span class="field-label">Возраст</span>
            <span class="capsule">
              <input type="number" id="age" name="age" min="14" max="100" step="1" inputmode="numeric" required placeholder="30">
              <span>лет</span>
            </span>
          </label>
          <label class="capsule-field">
            <span class="field-label">Рост</span>
            <span class="capsule">
              <input type="number" id="height" name="height" min="120" max="230" step="1" inputmode="numeric" required placeholder="175">
              <span>см</span>
            </span>
          </label>
          <label class="capsule-field">
            <span class="field-label">Вес</span>
            <span class="capsule">
              <input type="number" id="weight" name="weight" min="35" max="250" step="0.1" inputmode="decimal" required placeholder="70">
              <span>кг</span>
            </span>
          </label>
        </div>

        <fieldset class="field">
          <legend>Активность</legend>
          <div class="choice-pills choice-pills-wrap">
            <label><input type="radio" name="activity" value="1.2" checked data-hint="Сидячая работа, тренировок нет"><span>Минимальная</span></label>
            <label><input type="radio" name="activity" value="1.375" data-hint="Лёгкие тренировки 1–3 раза в неделю"><span>Низкая</span></label>
            <label><input type="radio" name="activity" value="1.55" data-hint="Тренировки 3–5 раз в неделю"><span>Средняя</span></label>
            <label><input type="radio" name="activity" value="1.725" data-hint="Интенсивные тренировки 6–7 раз в неделю"><span>Высокая</span></label>
            <label><input type="radio" name="activity" value="1.9" data-hint="Тяжёлая физическая работа или две тренировки в день"><span>Очень высокая</span></label>
          </div>
          <p class="field-hint" id="activity-hint">Сидячая работа, тренировок нет</p>
        </fieldset>

        <fieldset class="field">
          <legend>Цель</legend>
          <div class="choice-pills">
            <label><input type="radio" name="goal" value="lose"><span>Похудеть</span></label>
            <label><input type="radio" name="goal" value="maintain" checked><span>Держать вес</span></label>
            <label><input type="radio" name="goal" value="gain"><span>Набрать</span></label>
          </div>
        </fieldset>

        <button type="submit" class="button button-primary">Рассчитать</button>
      </form>

      <aside class="calc-result" aria-label="Результат">
        <div id="result" aria-live="polite"></div>
        <div class="result-actions" id="result-actions" hidden>
          <button type="button" class="button button-dark" id="show-menu-btn">Составить меню на день</button>
          <button type="button" class="button button-soft" id="share-btn">Поделиться</button>
        </div>
        <div class="mascot" id="calc-mascot"></div>
      </aside>
    </div>

    <section class="section" id="menu-section" hidden>
      <h2>Меню на день</h2>
      <p class="section-note" id="menu-subtitle"></p>
      <div id="meal-content"></div>
    </section>

    <section class="section" id="breakdown-section" hidden>
      <h2>Как получилась норма</h2>
      <dl class="breakdown" id="breakdown"></dl>
    </section>

    <section class="section" id="forecast" hidden>
      <h2>Прогноз веса на год</h2>
      <p class="section-note" id="forecast-note"></p>
      <div class="weight-chart" id="weight-chart"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Ещё на сайте: <a href="index.html">главная</a>, <a href="proteins.html">белки</a>, <a href="fats.html">жиры</a>, <a href="carbs.html">углеводы</a> и <a href="history.html">история</a>.</p>
    <p>Считаем приблизительно — это не замена врачу. Подробнее: <a href="about.html">о проекте</a>, <a href="privacy.html">конфиденциальность</a> и <a href="terms.html">условия использования</a>. <button class="theme-toggle" type="button" hidden></button></p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/modules/meal-database.js"></script>
  <script src="js/modules/meal-planner.js"></script>
  <script src="js/modules/meal-renderer.js"></script>
  <script src="js/modules/meal-menu.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
