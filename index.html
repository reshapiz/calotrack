<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CaloTrack считает дневную норму калорий, белков, жиров и углеводов и составляет примерное меню под вашу цель.">
  <meta name="theme-color" content="#f1ebe2">
  <title>CaloTrack — норма калорий и БЖУ</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" href="fonts/onest-variable.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="fonts/nunito-black.woff" as="font" type="font/woff" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme-manager.js"></script>
</head>
<body>
  <main class="page" id="main">
    <h1 class="display home-title">Сколько калорий нужно в&nbsp;день?</h1>

    <form class="sentence-form" id="quick-form" action="calculator.html" method="get">
      <p class="sentence">
        Я
        <select name="gender" aria-label="Пол">
          <option value="female" selected>женщина</option>
          <option value="male">мужчина</option>
        </select>,
        мне <input name="age" type="number" min="14" max="100" step="1" inputmode="numeric" value="28" required aria-label="Возраст, лет"> лет,
        рост <input name="height" type="number" min="120" max="230" step="1" inputmode="numeric" value="168" required aria-label="Рост, см"> см,
        вес <input name="weight" type="number" min="35" max="250" step="0.1" inputmode="decimal" value="64" required aria-label="Вес, кг"> кг.
        Тренируюсь
        <select name="activity" aria-label="Активность">
          <option value="1.2">редко или никогда</option>
          <option value="1.375">1–3 раза в неделю</option>
          <option value="1.55" selected>3–5 раз в неделю</option>
          <option value="1.725">6–7 раз в неделю</option>
          <option value="1.9">дважды в день</option>
        </select>
        и хочу
        <select name="goal" aria-label="Цель">
          <option value="lose">похудеть</option>
          <option value="maintain" selected>держать вес</option>
          <option value="gain">набрать массу</option>
        </select>.
      </p>
    </form>

    <div class="home-result">
      <div id="home-summary" aria-live="polite"></div>
      <div class="mascot" id="home-mascot"></div>
    </div>

    <div class="home-actions">
      <button type="submit" form="quick-form" class="button button-primary">Составить меню и прогноз</button>
      <p class="home-links">
        Подробнее про <a href="proteins.html">белки</a>, <a href="fats.html">жиры</a> и <a href="carbs.html">углеводы</a>.
        <span id="last-calculation" hidden></span>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <p>Ещё на сайте: <a href="calculator.html">расчёт нормы</a>, <a href="proteins.html">белки</a>, <a href="fats.html">жиры</a>, <a href="carbs.html">углеводы</a> и <a href="history.html">история</a>.</p>
    <p>Считаем приблизительно — это не замена врачу. Подробнее: <a href="about.html">о проекте</a>, <a href="privacy.html">конфиденциальность</a> и <a href="terms.html">условия использования</a>. <button class="theme-toggle" type="button" hidden></button></p>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/nutrition.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
